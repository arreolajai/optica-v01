<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Óptica 360 | Exámenes y Lentes</title>
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans p-4 relative" onload="verificarLicencia()">
    
    <!-- PANTALLA DE BLOQUEO POR LICENCIA -->
    <div id="pantalla-licencia" class="hidden fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-sm w-full text-center">
            <i class="fa-solid fa-lock text-5xl text-sky-600 mb-4"></i>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Licencia Requerida</h2>
            <p class="text-slate-600 text-sm mb-6">Tu período de acceso ha expirado o no se ha activado. Ingresa tu clave para continuar.</p>
            
            <input type="text" id="input-clave" placeholder="Ej. XXXX-XXXX-XXXX" class="w-full border-2 border-slate-300 p-3 rounded-lg mb-4 text-center font-mono uppercase tracking-widest focus:border-sky-500 outline-none">
            
            <button onclick="activarLicencia()" class="w-full bg-sky-600 text-white font-bold p-3 rounded-lg hover:bg-sky-700 transition">
                Activar Aplicación
            </button>
            <p id="error-licencia" class="text-red-500 text-sm mt-3 hidden font-semibold"></p>
        </div>
    </div>

    <!-- GENERADOR DE CLAVES OCULTO (ADMIN) -->
    <div id="panel-admin" class="hidden fixed inset-0 bg-black/80 z-[60] flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl shadow-2xl max-w-md w-full">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-sky-700"><i class="fa-solid fa-key"></i> Generador de Claves</h3>
                <button onclick="cerrarAdmin()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <p class="text-sm text-slate-600 mb-4">Selecciona el período para generar un token de activación válido.</p>
            
            <select id="tipo-licencia" class="w-full border p-2 rounded mb-4 bg-slate-50 font-semibold">
                <option value="7">Semanal (7 días)</option>
                <option value="30">Mensual (30 días)</option>
                <option value="180">Semestral (180 días)</option>
                <option value="365">Anual (365 días)</option>
            </select>
            
            <button onclick="generarClave()" class="w-full bg-slate-800 text-white font-bold p-2 rounded hover:bg-slate-900 transition mb-4">
                Generar Token
            </button>

            <div class="bg-slate-100 p-3 rounded text-center border">
                <span id="clave-generada" class="font-mono font-bold text-lg text-sky-700 tracking-widest">---</span>
            </div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-principal" class="hidden">
        <div class="text-right mb-2">
            <span id="estado-licencia" class="text-xs font-bold bg-sky-100 text-sky-700 px-3 py-1 rounded-full border border-sky-300"></span>
        </div>

        <div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-lg border-t-4 border-sky-600" id="reporte-pdf">
            <!-- DOBLE CLIC AQUÍ PARA ABRIR EL PANEL DE ADMIN -->
            <h1 ondblclick="abrirAdmin()" class="text-2xl font-bold text-center text-sky-700 mb-6 cursor-pointer select-none">
                <i class="fa-solid fa-glasses"></i> Óptica 360 | Reporte Visual
            </h1>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">Nombre del Paciente</label>
                    <input type="text" id="paciente" class="w-full border p-2 rounded bg-slate-50" placeholder="Ej. Juan Pérez">
                </div>

                <div class="grid grid-cols-2 gap-4 border p-4 rounded bg-slate-50">
                    <div>
                        <label class="block text-sm font-bold text-sky-700 mb-2">Ojo Derecho (OD)</label>
                        <input type="text" placeholder="Esfera" class="w-full border p-2 rounded mb-2">
                        <input type="text" placeholder="Cilindro" class="w-full border p-2 rounded mb-2">
                        <input type="text" placeholder="Eje" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-sky-700 mb-2">Ojo Izquierdo (OI)</label>
                        <input type="text" placeholder="Esfera" class="w-full border p-2 rounded mb-2">
                        <input type="text" placeholder="Cilindro" class="w-full border p-2 rounded mb-2">
                        <input type="text" placeholder="Eje" class="w-full border p-2 rounded">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 border p-4 rounded bg-slate-50">
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Adición (ADD)</label>
                        <input type="text" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Distancia Pupilar (DNP)</label>
                        <input type="text" class="w-full border p-2 rounded">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-1">Diagnóstico / Especificaciones de Lentes</label>
                    <textarea class="w-full border p-2 rounded bg-slate-50" rows="3" placeholder="Tipo de mica (Antirreflejante, Bifocal), modelo de armazón, observaciones..."></textarea>
                </div>
            </div>
        </div>

        <!-- Botones de Acción -->
        <div class="max-w-md mx-auto mt-6 space-y-3">
            <button onclick="generarYEnviarPDF()" class="w-full bg-sky-600 text-white p-3 rounded shadow-md hover:bg-sky-700 font-bold transition">
                <i class="fa-solid fa-file-pdf"></i> 1. Generar Reporte PDF
            </button>
            
            <div class="grid grid-cols-2 gap-3">
                <button onclick="enviarWhatsApp()" class="bg-green-500 text-white p-3 rounded shadow-md hover:bg-green-600 font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp
                </button>
                <button onclick="enviarCorreo()" class="bg-slate-700 text-white p-3 rounded shadow-md hover:bg-slate-800 font-bold transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-envelope"></i> Correo
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- MÓDULO DE LICENCIAMIENTO ---
        const SECRET_PIN = "OPTO360"; // Base para la validación de claves

        function verificarLicencia() {
            const expira = localStorage.getItem('optica_licencia_expira');
            const ahora = new Date().getTime();

            if (!expira || ahora > parseInt(expira)) {
                // Bloquear app
                document.getElementById('app-principal').classList.add('hidden');
                document.getElementById('pantalla-licencia').classList.remove('hidden');
            } else {
                // Permitir acceso y calcular días restantes
                document.getElementById('app-principal').classList.remove('hidden');
                document.getElementById('pantalla-licencia').classList.add('hidden');
                
                const diasRestantes = Math.ceil((parseInt(expira) - ahora) / (1000 * 60 * 60 * 24));
                document.getElementById('estado-licencia').innerText = `Licencia activa: ${diasRestantes} días restantes`;
            }
        }

        function activarLicencia() {
            const claveInput = document.getElementById('input-clave').value.trim().toUpperCase();
            const errorMsg = document.getElementById('error-licencia');
            
            // Lógica de validación: La clave debe tener el formato DIAS-SECRETO-ALEATORIO (Ej. 30-OPTO360-XYZ)
            const partes = claveInput.split('-');
            
            if (partes.length === 3 && partes[1] === SECRET_PIN) {
                const dias = parseInt(partes[0]);
                const ahora = new Date().getTime();
                const nuevaExpiracion = ahora + (dias * 24 * 60 * 60 * 1000);
                
                localStorage.setItem('optica_licencia_expira', nuevaExpiracion);
                errorMsg.classList.add('hidden');
                alert(`✅ Aplicación activada con éxito por ${dias} días.`);
                verificarLicencia();
            } else {
                errorMsg.innerText = "Clave inválida o expirada.";
                errorMsg.classList.remove('hidden');
            }
        }

        // --- MÓDULO SUPERADMIN (GENERADOR DE CLAVES) ---
        function abrirAdmin() {
            document.getElementById('panel-admin').classList.remove('hidden');
        }

        function cerrarAdmin() {
            document.getElementById('panel-admin').classList.add('hidden');
        }

        function generarClave() {
            const dias = document.getElementById('tipo-licencia').value;
            const aleatorio = Math.random().toString(36).substring(2, 6).toUpperCase();
            // Genera la clave estructurada
            const nuevaClave = `${dias}-${SECRET_PIN}-${aleatorio}`;
            document.getElementById('clave-generada').innerText = nuevaClave;
        }

        // --- MÓDULO DE PDF Y ENVÍOS (Misma lógica anterior) ---
        function generarYEnviarPDF() {
            const elemento = document.getElementById('reporte-pdf');
            const nombre = document.getElementById('paciente').value || 'Paciente';
            const opciones = {
                margin: 10, filename: `Receta_${nombre.replace(/\s+/g, '_')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opciones).from(elemento).save().then(() => {
                alert('✅ Receta PDF generada.');
            });
        }
        function enviarWhatsApp() {
            const numero = "521234567890";
            const paciente = document.getElementById('paciente').value || 'Paciente';
            window.open(`https://api.whatsapp.com/send?phone=${numero}&text=Hola ${paciente}, te adjuntamos tu reporte de examen visual.`, '_blank');
        }
        function enviarCorreo() {
            const correo = "paciente@ejemplo.com";
            const paciente = document.getElementById('paciente').value || 'Paciente';
            window.location.href = `mailto:${correo}?subject=Tu Receta Optométrica&body=Hola ${paciente}, adjuntamos tu reporte visual.`;
        }
    </script>
</body>
</html>
